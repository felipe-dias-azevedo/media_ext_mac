name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-arm:
    name: Build macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Build application
        run: |
          source ./build.sh

      - name: Package ARM DMG
        run: |
          mkdir dmgroot
          cp -R dist/MediaExt.app dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create \
            -volname "MediaExt" \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            MediaExt-macOS-arm64.dmg

          rm -rf dmgroot

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediaExt-macOS-arm64
          path: MediaExt-macOS-arm64.dmg

  build-x86:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Build application
        run: |
          source ./build.sh

      - name: Package Intel DMG
        run: |
          mkdir dmgroot
          cp -R dist/MediaExt.app dmgroot/
          ln -s /Applications dmgroot/Applications

          hdiutil create \
            -volname "MediaExt" \
            -srcfolder dmgroot \
            -ov \
            -format UDZO \
            MediaExt-macOS-intel.dmg

          rm -rf dmgroot

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediaExt-macOS-intel
          path: MediaExt-macOS-intel.dmg

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest

    needs:
      - build-arm
      - build-x86

    steps:
      - name: Download ARM artifact
        uses: actions/download-artifact@v5
        with:
          name: MediaExt-macOS-arm64
          path: release-assets

      - name: Download Intel artifact
        uses: actions/download-artifact@v5
        with:
          name: MediaExt-macOS-intel
          path: release-assets

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/MediaExt-macOS-arm64.dmg
            release-assets/MediaExt-macOS-intel.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
