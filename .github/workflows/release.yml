name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-arm:
    name: Build macOS ARM64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Build application
        run: |
          source ./build.sh

      - name: Package ARM build
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "MediaExt.app" \
            "MediaExt-macOS-arm64.zip"

      - name: Upload ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaExt-macOS-arm64
          path: dist/MediaExt-macOS-arm64.zip

  build-x86:
    name: Build macOS Intel
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Build application
        run: |
          source ./build.sh

      - name: Package Intel build
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "MediaExt.app" \
            "MediaExt-macOS-intel.zip"

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaExt-macOS-intel
          path: dist/MediaExt-macOS-intel.zip

  release:
    name: Create Draft Release
    runs-on: ubuntu-latest

    needs:
      - build-arm
      - build-x86

    steps:
      - name: Download ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaExt-macOS-arm64
          path: release-assets

      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaExt-macOS-intel
          path: release-assets

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/MediaExt-macOS-arm64.zip
            release-assets/MediaExt-macOS-intel.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
